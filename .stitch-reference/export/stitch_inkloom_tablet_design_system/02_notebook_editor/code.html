<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inkloom - Standard Notebook Editor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#2c4964",
                        "surface-container-highest": "#e1e3e2",
                        "inverse-primary": "#abcec1",
                        "surface-container-low": "#f2f4f3",
                        "on-primary-fixed-variant": "#2c4d43",
                        "background": "#f8faf9",
                        "error-container": "#ffdad6",
                        "surface-container": "#eceeed",
                        "outline-variant": "#c1c8c4",
                        "outline": "#717975",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#45627e",
                        "primary-container": "#5a7b70",
                        "tertiary": "#625773",
                        "primary": "#426258",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#ecdcfe",
                        "on-background": "#191c1c",
                        "on-surface": "#191c1c",
                        "secondary": "#44617d",
                        "on-error": "#ffffff",
                        "tertiary-container": "#7b6f8d",
                        "surface": "#f8faf9",
                        "on-tertiary-fixed": "#20172f",
                        "on-surface-variant": "#414845",
                        "surface-variant": "#e1e3e2",
                        "on-primary-fixed": "#002018",
                        "on-error-container": "#93000a",
                        "secondary-container": "#bfddfe",
                        "on-primary-container": "#f5fff9",
                        "surface-container-high": "#e6e9e8",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#4c425d",
                        "surface-dim": "#d8dad9",
                        "surface-tint": "#44655a",
                        "secondary-fixed": "#cee5ff",
                        "inverse-on-surface": "#eff1f0",
                        "surface-bright": "#f8faf9",
                        "tertiary-fixed-dim": "#cfc1e2",
                        "on-tertiary-container": "#fffbff",
                        "primary-fixed-dim": "#abcec1",
                        "on-secondary-fixed": "#001d33",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2e3131",
                        "secondary-fixed-dim": "#acc9ea",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#c6eadc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "side_rail_wide": "160dp",
                        "sub_bar_height": "40dp",
                        "grid_margin": "24dp",
                        "side_rail_narrow": "140dp",
                        "global_app_bar_height": "48dp",
                        "container_padding": "16dp",
                        "stack_gap": "12dp",
                        "grid_gutter": "16dp"
                    },
                    "fontFamily": {
                        "body-md": ["Noto Sans"],
                        "label-sm": ["Noto Sans"],
                        "label-lg": ["Noto Sans"],
                        "display-lg": ["Noto Sans"],
                        "display-md": ["Noto Sans"],
                        "headline-sm": ["Noto Sans"],
                        "body-lg": ["Noto Sans"]
                    },
                    "fontSize": {
                        "body-md": ["14sp", { "lineHeight": "20sp", "fontWeight": "400" }],
                        "label-sm": ["10sp", { "lineHeight": "14sp", "fontWeight": "500" }],
                        "label-lg": ["12sp", { "lineHeight": "16sp", "fontWeight": "500" }],
                        "display-lg": ["32sp", { "lineHeight": "40sp", "fontWeight": "600" }],
                        "display-md": ["24sp", { "lineHeight": "32sp", "fontWeight": "600" }],
                        "headline-sm": ["20sp", { "lineHeight": "28sp", "fontWeight": "500" }],
                        "body-lg": ["16sp", { "lineHeight": "24sp", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        .ruled-lines {
            background-image: repeating-linear-gradient(transparent, transparent 31px, var(--tw-colors-surface-variant) 32px);
            background-position: 0 40px;
        }
        .ink-stroke {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 2s ease forwards;
        }
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden flex flex-col font-body-md font-sans">
<!-- GlobalTopBar -->
<header class="flex justify-between items-center h-[48px] px-[24px] w-full bg-surface-container-lowest text-primary z-40 border-b border-surface-variant">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined font-bold text-primary">check_circle</span>
<span class="font-display-md text-[24px] font-semibold text-primary">Inkloom</span>
<div class="h-4 w-px bg-outline-variant mx-2"></div>
<span class="text-on-surface-variant font-body-md">Lecture 06 • Distributed Systems</span>
</div>
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-container-high rounded-full transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">search</span>
</button>
<button class="p-2 hover:bg-surface-container-high rounded-full transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">settings</span>
</button>
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant font-label-lg cursor-pointer">
                J
            </div>
</div>
</header>
<!-- Document Action Bar -->
<div class="flex items-center justify-between px-[24px] h-[40px] bg-surface-container-lowest border-b border-surface-variant z-30">
<div class="flex items-center gap-2">
<button class="p-1 hover:bg-surface-container-high rounded-full transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">chevron_left</span>
</button>
<span class="font-label-lg text-on-surface">Lecture 06 • Distributed Systems</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant">
<button class="p-1.5 hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined text-[20px]">book</span>
</button>
<button class="p-1.5 hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined text-[20px]">upload</span>
</button>
<button class="p-1.5 hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</div>
</div>
<!-- Main Workspace Area -->
<main class="flex-1 flex overflow-hidden bg-surface-container-low relative">
<!-- Left Sidebar: Thumbnail Rail -->
<aside class="w-[80px] bg-surface-container-lowest border-r border-surface-variant flex flex-col items-center py-4 gap-4 overflow-y-auto shrink-0 hidden md:flex">
<span class="text-on-surface-variant font-label-sm mb-2">Pages</span>
<div class="flex flex-col items-center gap-1 group cursor-pointer">
<div class="w-12 h-16 bg-surface border border-outline-variant rounded shadow-sm opacity-60 group-hover:opacity-100 transition-opacity"></div>
<span class="font-label-sm text-outline">1</span>
</div>
<div class="flex flex-col items-center gap-1 cursor-pointer">
<div class="w-14 h-[72px] bg-surface border-2 border-primary rounded shadow-md flex items-center justify-center bg-primary-container/20">
<div class="w-10 h-12 border border-outline-variant rounded-sm bg-white"></div>
</div>
<span class="font-label-sm text-primary font-bold">2</span>
</div>
<div class="flex flex-col items-center gap-1 group cursor-pointer">
<div class="w-12 h-16 bg-surface border border-outline-variant rounded shadow-sm opacity-60 group-hover:opacity-100 transition-opacity"></div>
<span class="font-label-sm text-outline">3</span>
</div>
<div class="flex flex-col items-center gap-1 group cursor-pointer">
<div class="w-12 h-16 bg-surface border border-outline-variant rounded shadow-sm opacity-60 group-hover:opacity-100 transition-opacity"></div>
<span class="font-label-sm text-outline">4</span>
</div>
</aside>
<!-- Center Canvas Area -->
<section class="flex-1 overflow-auto flex justify-center py-[24px] px-[16px] relative">
<!-- Floating Tool Dock -->
<nav class="fixed top-24 left-1/2 -translate-x-1/2 z-50 flex gap-2 items-center bg-surface/90 backdrop-blur-lg rounded-full px-6 py-2 shadow-lg border border-surface-variant">
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 min-w-[56px] transition-transform hover:scale-105">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">edit</span>
<span class="font-label-sm mt-1">Pen</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 min-w-[56px] rounded-xl hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined">ink_eraser</span>
<span class="font-label-sm mt-1">Eraser</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 min-w-[56px] rounded-xl hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined">lasso_select</span>
<span class="font-label-sm mt-1">Select</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 min-w-[56px] rounded-xl hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined">category</span>
<span class="font-label-sm mt-1">Shape</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 min-w-[56px] rounded-xl hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined">title</span>
<span class="font-label-sm mt-1">Text</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 min-w-[56px] rounded-xl hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined">sticky_note_2</span>
<span class="font-label-sm mt-1">Note</span>
</button>
<div class="w-px h-8 bg-outline-variant mx-1"></div>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 min-w-[40px] rounded-xl hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</nav>
<!-- Paper Sheet -->
<div class="bg-surface-container-lowest w-full max-w-[900px] min-h-[1200px] shadow-sm rounded-lg relative overflow-hidden mt-16">
<!-- Ruled Background -->
<div class="absolute inset-0 ruled-lines opacity-50 pointer-events-none"></div>
<!-- Content Layer -->
<div class="relative z-10 pt-[48px] px-[64px]">
<!-- Heading -->
<h1 class="font-display-lg text-[32px] text-on-surface font-semibold mb-2">Distributed Systems</h1>
<p class="font-body-lg text-outline mb-8">Consistency &amp; Replication</p>
<!-- Handdrawn strokes (SVG) -->
<svg class="absolute top-32 left-[64px] pointer-events-none stroke-on-surface-variant" fill="none" height="400" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 800 400" width="100%">
<!-- Simulated handwritten text lines -->
<path class="ink-stroke" d="M 0 30 Q 50 25 100 32 T 200 28 T 300 35 T 400 29"></path>
<path class="ink-stroke" d="M 0 62 Q 60 65 120 60 T 250 63 T 380 58 T 450 64" style="animation-delay: 0.2s"></path>
<path class="ink-stroke" d="M 0 94 Q 40 90 80 96 T 180 92 T 280 97 T 350 91" style="animation-delay: 0.4s"></path>
<!-- Highlight stroke -->
<path class="ink-stroke stroke-primary opacity-60" d="M 0 200 L 350 200" stroke-width="8" style="animation-delay: 0.6s"></path>
<!-- Circle annotation -->
<path class="ink-stroke stroke-error opacity-60" d="M 400 200 C 400 170 480 170 480 200 C 480 230 400 230 400 200 Z" stroke-width="3" style="animation-delay: 0.8s"></path>
</svg>
<!-- Sticky Note -->
<div class="absolute top-[160px] left-[450px] w-[240px] h-[160px] bg-[#fff9c4] rounded-lg shadow-md p-4 rotate-1 cursor-move transition-transform hover:scale-105 hover:shadow-lg border border-[#f0e68c]">
<h3 class="font-headline-sm text-on-surface mb-2">Remember</h3>
<p class="font-body-md text-on-surface-variant">Read section 5.3</p>
</div>
</div>
</div>
</section>
</main>
</body></html>
